; Configuración de Odoo para el laboratorio. Sin secretos reales (entorno descartable).
[options]
addons_path = /mnt/enterprise-addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; Odoo 20 escucha por defecto solo en 127.0.0.1 dentro del contenedor; hay que
; abrirlo a la red interna de Docker. La exposición al host la limita compose
; (puerto publicado solo en 127.0.0.1).
http_interface = 0.0.0.0
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo-lab
admin_passwd = lab-master-password
list_db = True
workers = 0
log_level = info
; Correo saliente al buzón de prueba Mailpit (compose.lab.yml): nada sale a internet.
smtp_server = mailpit
smtp_port = 1025
email_from = odoo-lab@example.com

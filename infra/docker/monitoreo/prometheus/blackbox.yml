# Pruebas de respuesta de Odoo (ADR 0028). Sin seguir redirecciones: /web/login con una sola
# base responde 200 directo; si da otro código, la prueba falla y se ve en el tablero.
modules:
  http_odoo:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4

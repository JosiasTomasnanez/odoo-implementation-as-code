# Compras SIN IVA incluido (23/10). El ajuste «precios con IVA incluido» de 05-ajustes.yaml es
# para los precios de VENTA (P-030), pero Odoo 20 lo aplica a todos los impuestos, también a los
# de compra: la factura A de un proveedor (precios sin IVA) quedaba con el neto achicado
# (FC: $ 720.926 en lugar de $ 872.321). Cada IVA de compra va «sin incluir», como en la
# factura del proveedor. A confirmar con el contador junto con P-030 (P-034).
# Las percepciones sufridas (IIBB de cada provincia, IVA, Ganancias) también: «incluidas», la línea
# que lleva la percepción en la factura restaba su importe del neto (comercio_factura_proveedor).
model: account.tax
match: [name, type_tax_use]
records:
  - id: iva_compras_21
    values: {name: "IVA 21%", type_tax_use: purchase, price_include_override: tax_excluded}
  - id: iva_compras_10_5
    values: {name: "IVA 10.5%", type_tax_use: purchase, price_include_override: tax_excluded}
  - id: iva_compras_27
    values: {name: "IVA 27%", type_tax_use: purchase, price_include_override: tax_excluded}
